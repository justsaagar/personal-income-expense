name: untitled
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Utils:
  carousel_slider: 5.0.0
  dropdown_button2: 2.3.9
  flutter_typeahead: ^5.2.0
  google_fonts: 6.2.1
  logger: 2.5.0
  image_picker: 1.1.2
  intl: 0.20.1
  url_launcher: 6.3.1
  permission_handler: 11.3.1
  device_info_plus: 11.2.0

  # Fetch server data & State management :
  get_it: 8.0.3
  get: 4.6.6
  http: 1.2.2
  json_annotation: 4.9.0
  internet_connection_checker_plus: 2.5.2
  connectivity_plus: 6.1.1
  package_info_plus: 8.1.2
  flutter_spinkit: 5.2.1

  # Image :
  flutter_svg: 2.0.16
  cached_network_image: 3.4.1
  shimmer: 3.0.0
  lottie: 3.3.0

  # Firebase:
  firebase_core: 3.8.1
  firebase_auth: 5.3.4
  cloud_firestore: 5.5.1
  firebase_storage: 12.3.7
  firebase_remote_config: 5.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  build_runner: 2.4.13
  flutter_test:
    sdk: flutter

  # Model management :
  json_serializable: 6.9.0

  # Utils:
  lint: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
